<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>宗心会 オンライン新年会</title>
<link rel="stylesheet" href="compare.css?v=pilot-c2">
<script defer src="config.js?v=pilot-c2"></script>
<script defer src="app-pilot-c2.js"></script>
</head>
<body><main>
<p class="eyebrow">宗心会 · 2027</p>
<h1>オンライン新年会</h1>
<p class="event-date">2027年1月2日（土）<br><strong>18:30〜21:00（日本時間）</strong></p>
<p>出入り自由・出欠回答は不要です。</p>
<p class="badge">役員向け事前確認</p>
<p class="notice">今回は試験用の会議室につながります。担当者から開始の案内が届いたら、下のボタンからお進みください。</p>
<p id="status" role="status">開始の案内をお待ちください。</p>
<button id="start" type="button">本人確認をして参加へ進む</button>
<p id="result" role="status"></p>
<button id="join" type="button" hidden>Zoomに参加する</button>
<p id="retryNote" hidden>Zoomが開かない場合は、担当者にお知らせください。今回の参加操作は1回です。</p>
<section id="admin" hidden>
<h2>管理者設定</h2>
<p>試験会議室の準備状況を確認できます。</p>
<button id="settings" type="button">会議室の設定状況を確認</button>
<p id="settingStatus" role="status"></p>
</section>
<p id="error" role="alert"></p>
<p id="version" role="status">画面の読み込み待ち</p><footer>試験中に困ったことがあれば、担当者へお知らせください。</footer>
</main></body></html>
